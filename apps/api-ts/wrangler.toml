name = "topa-math-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# Cloudflare Workers Free plan: 100,000 requests/day for the whole account.
# Keep this API as small as possible and let the Next.js frontend serve static
# assets directly from the Workers assets runtime (see ../../wrangler.toml).

[observability]
enabled = true

[vars]
# Production defaults. Local development overrides these through .dev.vars
# (which Wrangler loads on top of wrangler.toml and takes precedence locally).
#
# ENVIRONMENT=production makes the API reject the beta-only visibility
# fallbacks that the legacy FastAPI service used while the content was still
# awaiting review.
ENVIRONMENT = "production"
# Comma-separated list of allowed browser origins (credentials are sent, so
# wildcards are not allowed — same rule as the FastAPI CORS middleware).
CORS_ORIGINS = "https://topamath.com,https://www.topamath.com"
# Auth cookie behaviour (matches the Python settings names).
AUTH_COOKIE_NAME = "access_token"
AUTH_COOKIE_SECURE = "true"
AUTH_COOKIE_SAMESITE = "lax"
AUTH_COOKIE_PATH = "/"
ACCESS_TOKEN_EXPIRE_MINUTES = "1440"
# Password hashing runs in Postgres (apps/api-ts/scripts/pbkdf2.sql), not in
# the Worker: the Workers Free plan allows only 10 ms of CPU per request and
# a 200,000-round PBKDF2 costs ~86 ms of CPU even via native WebCrypto
# (measured in workerd). Database time is not charged against the Worker's
# CPU budget.
#
# The iteration count is fixed at 200,000 in SQL, matching the legacy FastAPI
# service (app/core/security.py), so password hashes stay interchangeable
# between the two APIs. There is deliberately no PASSWORD_HASH_ITERATIONS
# variable.

# Secrets (set with `wrangler secret put <NAME>`):
#   DATABASE_URL        — Neon pooled connection string
#   JWT_SECRET          — HS256 secret shared with the legacy FastAPI service
#
# Optional R2 binding for the site CMS content (see src/lib/content.ts).
# Uncomment and create the bucket to enable live CMS updates:
# [[r2_buckets]]
# binding = "CONTENT_BUCKET"
# bucket_name = "topa-math-content"
