name: Fetch Workers Builds log

# Temporary diagnostic: Cloudflare Workers Builds keeps its build log in the
# Cloudflare dashboard, which is behind an interactive bot challenge. This
# workflow asks the Cloudflare API for the same log using the API token the
# deploy workflow already uses, and prints it in the Actions log.
#
# Token-shaped strings are redacted before anything is printed.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Workers Builds ID (optional - defaults to the latest build)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Fetch build log from the Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -uo pipefail

          if [ -z "${CF_ACCOUNT:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set on this environment."
            exit 1
          fi

          redact() {
            sed -E \
              -e 's/(Bearer )[A-Za-z0-9._~+\/-]{16,}/\1[REDACTED]/g' \
              -e 's/\beyJ[A-Za-z0-9._-]{16,}\b/[REDACTED_JWT]/g' \
              -e 's/([A-Za-z0-9_-]{48,})/[REDACTED_LONG]/g'
          }

          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}"
          tmp=$(mktemp -d)

          if [ -z "${BUILD_ID:-}" ]; then
            echo "=== listing builds ==="
            for lp in "workers/builds" "builds"; do
              code=$(curl -sS --compressed -o "${tmp}/list.json" -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${base}/${lp}?per_page=5" || true)
              echo "GET /${lp} -> HTTP ${code}"
              head -c 2000 "${tmp}/list.json" | redact
              echo ""
            done
            BUILD_ID=$(grep -o '"id":"[0-9a-f-]\{36\}"' "${tmp}/list.json" | head -1 | sed -E 's/.*"id":"([^"]+)".*/\1/' || true)
            echo "resolved build id: ${BUILD_ID:-none}"
          fi

          echo "using build id: ${BUILD_ID:-none}"

          for path in "builds/${BUILD_ID}" "builds/${BUILD_ID}/logs" "workers/builds/${BUILD_ID}" "workers/builds/${BUILD_ID}/logs" "workers/scripts/topa-math/builds" "workers/scripts/topa-math/builds/${BUILD_ID}" "workers/services/topa-math/builds" "workers/services/topa-math/builds/${BUILD_ID}" "workers/services/view/topa-math/production/builds/${BUILD_ID}" "workers/builds/${BUILD_ID}/deployment"; do
            echo ""
            echo "=================== GET /accounts/.../${path} ==================="
            safe=$(echo "${path}" | tr '/' '_')
            code=$(curl -sS --compressed -o "${tmp}/${safe}.out" -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${base}/${path}" || true)
            size=$(wc -c < "${tmp}/${safe}.out" 2>/dev/null || echo 0)
            echo "HTTP ${code}  (${size} bytes)"
            if [ "${code}" != "404" ]; then
              head -c 2000 "${tmp}/${safe}.out" | redact
              echo ""
            fi
          done

          echo ""
          echo "=================== build history structure ==================="
          history="${tmp}/workers_scripts_topa-math_builds.out"
          if [ -s "${history}" ]; then
            echo "-- top level --"
            jq -r 'type' "${history}" 2>/dev/null | head -3
            jq -r 'if type=="object" then (keys|join(", ")) else "array len=" + (length|tostring) end' "${history}" 2>/dev/null | head -5
            echo "-- first entry keys --"
            jq -r 'if type=="array" then .[0]|keys|join(", ") else (.result // .) | if type=="array" then .[0]|keys|join(", ") else keys|join(", ") end end' "${history}" 2>/dev/null | head -8
          fi

          echo ""
          echo "=================== log for build ${BUILD_ID} ==================="
          jq -r --arg id "${BUILD_ID}" '
            (if type=="array" then . else (.result // .) end)
            | (if type=="array" then . else (.builds // .items // []) end)
            | (map(select((.build_uuid // .id // "") == $id)) | first)
            | if . == null then "build not found in history"
              else "outcome: " + ((.build_outcome // .status // "?" | tostring)),
                   "--- log lines ---",
                   ((.build_outcome.logs // .logs // .build_log // .log // []) | tostring | .[0:6000]),
                   "--- trigger ---",
                   ((.build_trigger_metadata // {}) | tostring | .[0:1500])
              end
          ' "${history}" 2>&1 | redact | head -120

          echo ""
          echo "=== done ==="
