name: 4craft-beta

services:
  4craft-postgres:
    image: postgres:16-alpine
    container_name: 4craft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adaptive_learning}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_beta_change_me}
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - 4craft-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  4craft-redis:
    image: redis:7-alpine
    container_name: 4craft-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - 4craft-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  4craft-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: 4craft-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres_beta_change_me@4craft-postgres:5432/adaptive_learning}
      REDIS_URL: ${REDIS_URL:-redis://4craft-redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-replace_with_local_docker_beta_secret_32_chars_minimum}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-topa_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:8001}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_EP_FOUNDER_MONTHLY: ${STRIPE_PRICE_EP_FOUNDER_MONTHLY:-}
      STRIPE_PRICE_TH_FOUNDER_MONTHLY: ${STRIPE_PRICE_TH_FOUNDER_MONTHLY:-}
      STRIPE_PRICE_EP_PLUS_MONTHLY: ${STRIPE_PRICE_EP_PLUS_MONTHLY:-}
      STRIPE_PRICE_TH_PLUS_MONTHLY: ${STRIPE_PRICE_TH_PLUS_MONTHLY:-}
      STRIPE_PRICE_EP_PLUS_YEARLY_PROMO: ${STRIPE_PRICE_EP_PLUS_YEARLY_PROMO:-}
      STRIPE_PRICE_TH_PLUS_YEARLY_PROMO: ${STRIPE_PRICE_TH_PLUS_YEARLY_PROMO:-}
      STRIPE_CUSTOMER_PORTAL_RETURN_URL: ${STRIPE_CUSTOMER_PORTAL_RETURN_URL:-http://localhost:3000/dashboard}
      AFFILIATE_COMMISSION_RATE_BPS: ${AFFILIATE_COMMISSION_RATE_BPS:-300}
      AFFILIATE_COMMISSION_HOLD_DAYS: ${AFFILIATE_COMMISSION_HOLD_DAYS:-7}
      AFFILIATE_MIN_WITHDRAWAL_MINOR: ${AFFILIATE_MIN_WITHDRAWAL_MINOR:-50000}
      AFFILIATE_ADMIN_NOTIFICATION_EMAIL: ${AFFILIATE_ADMIN_NOTIFICATION_EMAIL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MPP_API_BASE_URL: ${MPP_API_BASE_URL:-https://staging-api.mmerchat.cc/api/v1}
      MPP_PAYMENT_BASE_URL: ${MPP_PAYMENT_BASE_URL:-https://staging-pay.mmerchat.cc}
      MPP_PROJECT_API_KEY: ${MPP_PROJECT_API_KEY:-}
      MPP_WEBHOOK_SIGNING_SECRET: ${MPP_WEBHOOK_SIGNING_SECRET:-}
    ports:
      - "${API_HOST:-127.0.0.1}:${API_PORT:-8001}:8001"
    volumes:
      # Docker Desktop on Windows resolves a relative bind source to /mnt/c/<...>,
      # but the WSL2 backend does not mount /mnt/c -> the container got an empty
      # tmpfs instead of the real files (site/homepage.json missing -> HTTP 500).
      # Windows-native absolute paths are resolved correctly by Docker Desktop.
      # Content is ALSO baked into the image (see apps/api/Dockerfile) so the
      # image stays self-contained for Cloudflare Containers / CI.
      - "${TOPA_PROJECT_ROOT:-C:/web-app/4-craft.com}/apps/api/app/content/math:/app/app/content/math"
      - "${TOPA_PROJECT_ROOT:-C:/web-app/4-craft.com}/apps/api/app/content/site:/app/app/content/site"
      - "${TOPA_PROJECT_ROOT:-C:/web-app/4-craft.com}/storage/uploads:/app/storage/uploads"
    depends_on:
      4craft-postgres:
        condition: service_healthy
      4craft-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10

  4craft-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: 4craft-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      4craft-api:
        condition: service_healthy

volumes:
  4craft-postgres-data:
  4craft-redis-data:
