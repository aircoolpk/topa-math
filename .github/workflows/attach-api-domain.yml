name: Attach the API domain to the Worker

# Topa Math — move api.topamath.com from the tunnel to the API Worker.
#
# The Worker answers the same paths with the same bodies as the legacy
# FastAPI (the parity harness reports 15 of 15 identical), so the domain
# can point straight at the Worker. The tunnel keeps running and still
# points at the native FastAPI, which is the fallback: if the Worker ever
# misbehaves, running this workflow with `restore` puts the DNS record
# back and the FastAPI answers again within a minute.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'attach = point the domain at the Worker, restore = point it back at the tunnel'
        required: false
        default: 'attach'

jobs:
  attach:
    name: Move the api domain
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read the zone and the current record
        id: current
        run: |
          set -euo pipefail
          zone=$(curl -s --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF/zones?name=topamath.com" | python -c 'import json,sys; print(json.load(sys.stdin)["result"][0]["id"])')
          echo "ZONE_ID=$zone" >> "$GITHUB_ENV"
          record=$(curl -s --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF/zones/$zone/dns_records?name=api.topamath.com" | python -c 'import json,sys; r=json.load(sys.stdin)["result"]; print(r[0]["id"] if r else "")')
          echo "RECORD_ID=$record" >> "$GITHUB_ENV"
          echo "the zone is $zone and the record is ${record:-none}"
        env:
          CF: https://api.cloudflare.com/client/v4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Attach the custom domain to the Worker
        if: inputs.action != 'restore'
        run: |
          set -euo pipefail
          # The tunnel owns a CNAME for the api hostname, and the Worker needs
          # its own record, so the old one is removed first.
          if [ -n "$RECORD_ID" ]; then
            curl -s --max-time 30 -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$CF/zones/$ZONE_ID/dns_records/$RECORD_ID" | python -c 'import json,sys; d=json.load(sys.stdin); print("removed the tunnel record" if d.get("success") else d)'
          fi
          echo "--- attaching the custom domain ---"
          curl -s --max-time 30 -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"hostname":"api.topamath.com","service":"topa-math-api","zone_name":"topamath.com","environment":"production"}' \
            "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" | tee domain.json
          python - <<'PY'
          import json
          with open('domain.json') as handle:
              body = json.load(handle)
          if not body.get('success'):
              raise SystemExit(f"the custom domain was refused: {body.get('errors')}")
          print("the api domain now points at the Worker")
          PY
        env:
          CF: https://api.cloudflare.com/client/v4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Restore the tunnel record
        if: inputs.action == 'restore'
        run: |
          set -euo pipefail
          curl -s --max-time 30 -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"api","content":"topamath-beta.cfargotunnel.com","proxied":true,"ttl":1}' \
            "$CF/zones/$ZONE_ID/dns_records" | python -c 'import json,sys; d=json.load(sys.stdin); print("the tunnel record is back" if d.get("success") else d)'
        env:
          CF: https://api.cloudflare.com/client/v4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check the domain
        run: |
          sleep 20
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://api.topamath.com/health || true)
            echo "attempt $attempt: api.topamath.com/health -> $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::warning::the api domain did not answer yet"
