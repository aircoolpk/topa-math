name: Fetch Workers Builds log

# Temporary diagnostic: Cloudflare Workers Builds keeps its build log in the
# Cloudflare dashboard, which is behind an interactive bot challenge. This
# workflow asks the Cloudflare API for the same log using the API token the
# deploy workflow already uses, and prints it in the Actions log.
#
# Token-shaped strings are redacted before anything is printed.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Workers Builds ID (optional - defaults to the latest build)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Fetch build log from the Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -uo pipefail

          if [ -z "${CF_ACCOUNT:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set on this environment."
            exit 1
          fi

          redact() {
            sed -E \
              -e 's/(Bearer )[A-Za-z0-9._~+\/-]{16,}/\1[REDACTED]/g' \
              -e 's/\beyJ[A-Za-z0-9._-]{16,}\b/[REDACTED_JWT]/g' \
              -e 's/([A-Za-z0-9_-]{48,})/[REDACTED_LONG]/g'
          }

          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}"
          tmp=$(mktemp -d)

          if [ -z "${BUILD_ID:-}" ]; then
            echo "=== resolving the latest build ==="
            code=$(curl -sS --compressed -o "${tmp}/latest.json" -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${base}/workers/builds?per_page=5" || true)
            echo "GET /workers/builds -> HTTP ${code}"
            head -c 3000 "${tmp}/latest.json" | redact
            echo ""
            BUILD_ID=$(grep -o '"id":"[0-9a-f-]\{36\}"' "${tmp}/latest.json" | head -1 | sed -E 's/.*"id":"([^"]+)".*/\1/')
            echo "latest build id: ${BUILD_ID:-none}"
          fi

          for path in "builds/${BUILD_ID}" "builds/${BUILD_ID}/logs" "workers/builds/${BUILD_ID}" "workers/builds/${BUILD_ID}/logs" "workers/scripts/topa-math/builds"; do
            echo ""
            echo "=================== GET /accounts/.../${path} ==================="
            safe=$(echo "${path}" | tr '/' '_')
            code=$(curl -sS --compressed -o "${tmp}/${safe}.out" -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${base}/${path}" || true)
            echo "HTTP ${code}  ($(wc -c < "${tmp}/${safe}.out" 2>/dev/null || echo 0) bytes)"
            head -c 8000 "${tmp}/${safe}.out" | redact
            echo ""
          done

          echo ""
          echo "=== done ==="
